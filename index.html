<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elektric Animals</title>
<meta name="description" content="Elektric Animals: listen to B &amp; B MOTEL, the debut album. Merch, booking, socials and more.">
<meta name="theme-color" content="#2b150a">
<link rel="icon" type="image/jpeg" href="art/crest.jpg">
<link rel="apple-touch-icon" href="art/crest.jpg">
<meta property="og:type" content="website">
<meta property="og:title" content="Elektric Animals">
<meta property="og:description" content="B &amp; B MOTEL, the debut album, out now. Listen, shop merch and book the band.">
<meta property="og:url" content="https://elektricanimals.com/">
<meta property="og:image" content="https://elektricanimals.com/art/cover.jpg">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&family=Red+Hat+Text:wght@400;500;700&family=Red+Hat+Mono:wght@500&family=Shrikhand&display=swap">
<style>
/* Layout: B&B MOTEL record sleeve as a phone app — header with crest + wordmark, five swipeable rooms (scroll-snap), bottom tab bar */
:root{
  --sleeve:#f7f4ee;   /* inner-sleeve off-white */
  --paper:#ffffff;
  --rust:#d5471f;     /* crest orange */
  --mustard:#e9a750;  /* crest gold */
  --bark:#2b150a;     /* weathered wood, darkest */
  --wood:#6b3517;
  --sky:#d6f0f6;      /* back-cover sky */
  --muted:#8a6c58;
  --line:#e6dccd;
  --display:"Red Hat Display", "Helvetica Neue", Arial, sans-serif;
  --body:"Red Hat Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Red Hat Mono", ui-monospace, Menlo, monospace;
  --script:"Shrikhand", Georgia, serif;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--sleeve);color:var(--bark);font-family:var(--body);font-size:16px;line-height:1.45;
  display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--rust);outline-offset:3px;border-radius:4px}

/* header */
.top{
  flex:none;display:flex;align-items:center;gap:10px;background:var(--bark);
  padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:10px;
}
.top .badge{width:34px;height:34px;flex:none;border-radius:4px;overflow:hidden}
.top .badge img{width:100%;height:100%;object-fit:cover}
.top .wm{flex:1;min-width:0;display:flex}
.top .wm img{height:22px;width:auto;max-width:100%;object-fit:contain;object-position:left center}
.top .rpm{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--mustard);opacity:.8;white-space:nowrap}

.draft{
  flex:none;font-family:var(--mono);font-size:11px;color:var(--mustard);background:var(--rust);
  padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:6px;display:flex;justify-content:space-between;gap:8px;align-items:center
}
.draft button{font-family:var(--mono);font-size:11px;text-decoration:underline;color:var(--mustard)}

/* pager */
.pager{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}
.pager::-webkit-scrollbar{display:none}
.pane{flex:0 0 100%;width:100%;height:100%;overflow-y:auto;scroll-snap-align:start;scroll-snap-stop:always;overscroll-behavior-y:contain}
.inner{
  max-width:520px;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:18px 36px;
  display:flex;flex-direction:column;gap:22px;
}

/* type */
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust)}
h2{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(30px,9vw,42px);line-height:.92;letter-spacing:-.01em;margin:6px 0 0;color:var(--bark);text-wrap:balance}
h2 em{font-style:normal;color:var(--rust)}
.codes{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mustard)}

/* home: sleeve headline */
.sleeve-head{display:inline-block;font-family:var(--display);font-weight:900;color:var(--mustard);line-height:.8;white-space:nowrap;letter-spacing:-.02em;margin:0 0 -6px;font-size:64px}
.cover{position:relative;display:block;width:100%;max-width:440px;align-self:center;box-shadow:0 18px 40px -18px rgba(43,21,10,.55)}
.cover img{width:100%;height:auto;aspect-ratio:4/7;object-fit:cover;object-position:50% 50%}
.mv{display:flex;flex-direction:column;gap:10px}
.mv-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.mv-head .s{font-family:var(--script);font-size:30px;line-height:1;color:var(--mustard);text-shadow:2px 2px 0 var(--rust)}
.mv-frame{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:var(--bark);overflow:hidden;box-shadow:0 14px 30px -16px rgba(43,21,10,.6)}
.mv-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mv-play{position:absolute;inset:0;width:100%;height:100%;padding:0;cursor:pointer;background:var(--bark) url("art/crest.jpg") center/22% no-repeat}
.mv-play img{display:block;width:100%;height:100%;object-fit:cover}
.mv-play .btnp{position:absolute;left:50%;top:50%;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;background:var(--rust);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.45);transition:transform .15s}
.mv-play .btnp svg{width:30px;height:30px;fill:var(--mustard);margin-left:4px}
.mv-play:hover .btnp{transform:scale(1.08)}
.mv-play .cap{position:absolute;left:0;bottom:0;padding:6px 10px;background:var(--bark);color:var(--mustard);font-family:var(--display);font-weight:900;font-size:13px;letter-spacing:.06em}
.mv-link{align-self:flex-end;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--rust)}

.cta{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 12px;
  font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:14px;letter-spacing:.04em;
  background:var(--rust);color:var(--mustard);transition:transform .12s}
.btn.alt{background:var(--bark);color:var(--mustard)}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px;fill:currentColor}

/* link rows */
.links{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:14px;min-height:62px;padding:10px 14px;background:var(--paper);border:1px solid var(--line);
  transition:transform .12s, border-color .2s}
.row:active{transform:scale(.98)}
.row:hover{border-color:var(--rust)}
.row .ic{width:38px;height:38px;display:grid;place-items:center;background:var(--rust);flex:none}
.row .ic svg{width:20px;height:20px;fill:none;stroke:var(--mustard);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row .lbl{flex:1;min-width:0}
.row .lbl b{display:block;font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:15px;letter-spacing:.02em}
.row .lbl small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .arr{color:var(--rust);font-weight:700}
.row.primary{background:var(--rust);border-color:var(--rust);color:var(--mustard)}
.row.primary .lbl small,.row.primary .arr{color:var(--mustard);opacity:.85}
.row.primary .ic{background:var(--bark)}

/* tracklist block, as on the back cover */
.backcover{background:var(--sky);padding:28px 18px 20px;display:flex;flex-direction:column;align-items:center;gap:14px}
.backcover .over{font-family:var(--display);font-weight:700;text-transform:uppercase;color:var(--mustard);text-align:center;line-height:1.05;font-size:18px;text-shadow:0 1px 0 rgba(43,21,10,.08)}
.tracklist{list-style:none;margin:0;padding:20px 12px;background:var(--rust);width:100%;max-width:340px;counter-reset:t;display:flex;flex-direction:column;gap:8px}
.tracklist li{counter-increment:t;display:flex;align-items:baseline;justify-content:center;gap:8px;text-align:center;
  font-family:var(--display);font-weight:700;text-transform:uppercase;color:var(--mustard);font-size:clamp(14px,4.4vw,17px);line-height:1.15}
.tracklist li::before{content:counter(t);font-family:var(--mono);font-size:10px;opacity:.6;font-weight:500}
.backcover .hint{margin:0;font-size:14px;color:var(--wood);text-align:center}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px 8px;width:100%;max-width:420px}
.key{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 2px 8px;min-width:0;background:var(--rust);color:var(--mustard);border-radius:6px 6px 20px 20px;cursor:pointer;transition:transform .15s, background .2s;transform-origin:50% 0}
.key::before{content:"";position:absolute;top:5px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--sky)}
.key .no{font-family:var(--display);font-weight:900;font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.key .kn{font-family:var(--mono);font-size:8px;letter-spacing:.04em;text-transform:uppercase;line-height:1.15;text-align:center;opacity:.85;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-width:100%}
.key:hover{transform:rotate(-4deg)}
.key[aria-pressed="true"]{background:var(--bark);transform:rotate(-6deg) translateY(4px)}
.roomcard{width:100%;max-width:420px;background:var(--paper);border:1px solid var(--line);padding:14px;min-height:72px;display:flex;flex-direction:column;gap:10px}
.rc-empty{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;margin:auto}
.rc-top{display:flex;align-items:baseline;gap:10px}
.rc-top .rn{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--rust)}
.rc-top .rl{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rc-title{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:22px;line-height:1;color:var(--bark)}
.rc-story{margin:0;font-size:14px;color:var(--wood)}
.rc-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rc-acts .btn{min-height:44px;font-size:12px}
.sp iframe{display:block;width:100%;height:352px;border:0;border-radius:12px}
/* front desk signup */
.desk{position:relative;background:var(--bark);color:var(--sleeve);padding:16px;display:flex;flex-direction:column;gap:10px}
.desk.big{border:2px solid var(--mustard)}
.desk-head{display:flex;align-items:center;gap:12px}
.desk-head .bell{width:40px;height:40px;flex:none;display:grid;place-items:center;background:var(--rust)}
.desk-head .bell svg{width:22px;height:22px;fill:none;stroke:var(--mustard);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.desk-head .kicker{color:var(--mustard)}
.desk-head b{display:block;font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:18px;line-height:1.05;color:var(--sleeve)}
.desk p{margin:0;font-size:14px;line-height:1.45;color:#e6d6c4}
.desk-row{display:flex;gap:8px;flex-wrap:wrap}
.desk-row input[type=email]{flex:1 1 180px;min-width:0;font:inherit;font-size:16px;padding:12px;border:0;background:var(--sleeve);color:var(--bark)}
.desk-row input[type=email]:focus{outline:2px solid var(--mustard);outline-offset:0}
.desk-row .btn{border:0;min-height:48px;padding:10px 16px;flex:0 0 auto}
.desk-msg{font-family:var(--mono);font-size:12px!important;color:var(--mustard)!important;min-height:0}
.desk-msg:empty{display:none}
.desk.done .desk-row{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* vinyl offer over the cover */
.cover .seal{position:absolute;top:12px;right:12px;width:76px;height:76px;border-radius:50%;background:var(--mustard);color:var(--bark);display:grid;place-content:center;text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;line-height:1.2;transform:rotate(12deg);box-shadow:0 4px 12px rgba(0,0,0,.3);border:2px dashed var(--bark)}
.cover .seal b{display:block;font-family:var(--display);font-weight:900;font-size:24px;letter-spacing:0;line-height:1}
.vinyl{position:absolute;left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:10px 12px;background:var(--bark);color:var(--mustard);box-shadow:0 10px 24px rgba(0,0,0,.45);transition:transform .15s}
.vinyl:active{transform:scale(.98)}
.vinyl .disc{width:52px;height:52px;border-radius:50%;flex:none;background:radial-gradient(circle,var(--paper) 0 8%,#4fa8d8 9% 30%,rgba(120,195,235,.75) 31% 33%,#5bb3e0 34% 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 0 0 1px rgba(0,0,0,.3);animation:spin 6s linear infinite}
.vinyl .disc::after{content:"";display:block;width:100%;height:100%;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 3px,rgba(255,255,255,.12) 3px 4px)}
@keyframes spin{to{transform:rotate(360deg)}}
.vinyl .vt{min-width:0;display:flex;flex-direction:column;gap:2px}
.vinyl .vt b{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:16px;line-height:1.05}
.vinyl .vt small{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.vinyl .vgo{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:13px;background:var(--rust);color:var(--mustard);padding:10px 12px;white-space:nowrap}
.backcover .credit{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--wood);text-align:center}

.disco{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.disco li{border-bottom:1px solid var(--line)}
.disco a{display:flex;gap:12px;align-items:baseline;padding:12px 2px}
.disco .y{font-family:var(--mono);color:var(--rust);font-size:13px;width:40px;flex:none;font-variant-numeric:tabular-nums}
.disco .t{flex:1;min-width:0;font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:14px}
.disco .k{font-family:var(--mono);color:var(--muted);font-size:12px}

/* shows: dates on motel key fobs */
.show{display:grid;grid-template-columns:62px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.show:first-child{border-top:1px solid var(--line)}
.fob{position:relative;background:var(--rust);color:var(--mustard);text-align:center;padding:16px 0 8px;border-radius:6px 6px 22px 22px;line-height:1;font-variant-numeric:tabular-nums}
.fob::before{content:"";position:absolute;top:5px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--sleeve)}
.fob .m{font-family:var(--mono);font-size:10px;letter-spacing:.12em}
.fob .dd{font-family:var(--display);font-weight:900;font-size:26px;margin-top:3px}
.show .v{min-width:0}
.show .v b{display:block;font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:15px}
.show .v small{color:var(--muted);font-size:13px}
.tix{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:12px;letter-spacing:.04em;padding:9px 12px;border:2px solid var(--rust);color:var(--rust);white-space:nowrap}
.tix.low{background:var(--rust);color:var(--mustard)}
.tix.sold{border-color:var(--line);color:var(--muted);pointer-events:none}
.vacancy{display:flex;align-items:center;gap:12px;background:var(--bark);color:var(--mustard);padding:14px 16px}
.vacancy b{font-family:var(--display);font-weight:900;letter-spacing:.12em;font-size:15px;color:var(--rust);text-shadow:0 0 10px rgba(213,71,31,.7);animation:buzz 6s infinite}
.vacancy span{font-size:13px;line-height:1.3}
@keyframes buzz{0%,92%,96%,100%{opacity:1}94%,98%{opacity:.35}}

.notice{margin:0;font-size:16px;line-height:1.5;color:var(--wood);max-width:42ch}
.hanger{align-self:center;position:relative;width:min(220px,62%);background:var(--rust);color:var(--mustard);text-align:center;
  padding:74px 16px 26px;border-radius:10px 10px 4px 4px;transform:rotate(-3deg);box-shadow:0 14px 26px -12px rgba(43,21,10,.55);
  transform-origin:50% 0;animation:sway 5s ease-in-out infinite}
.hanger::before{content:"";position:absolute;top:18px;left:50%;width:46px;height:46px;margin-left:-23px;border-radius:50%;background:var(--sleeve)}
.hanger::after{content:"";position:absolute;top:30px;left:50%;width:4px;height:30px;margin-left:-2px;background:var(--rust);border-radius:2px}
.h-top{font-family:var(--script);font-size:22px;line-height:1;text-shadow:2px 2px 0 var(--bark)}
.h-big{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:30px;line-height:.95;margin-top:8px;letter-spacing:.01em}
.h-sub{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-top:12px;opacity:.9}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(2deg)}}
.log{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.log li{display:grid;grid-template-columns:100px 1fr;gap:14px;padding:12px 2px;border-bottom:1px solid var(--line);align-items:baseline}
.log .when{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--rust)}
.log .what{color:var(--muted);font-size:14px}
.log .what b{display:block;font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:15px;color:var(--bark)}

.form{gap:14px;background-image:none}
.form label{display:flex;flex-direction:column;gap:5px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--wood);min-width:0}
.form input,.form select,.form textarea{font:inherit;font-family:var(--body);font-size:16px;letter-spacing:0;text-transform:none;color:var(--bark);
  background:var(--sleeve);border:0;border-bottom:2px solid var(--line);padding:10px 8px;border-radius:0;width:100%;min-width:0}
.form input:focus,.form select:focus,.form textarea:focus{outline:none;border-bottom-color:var(--rust);background:var(--paper)}
.form .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.register.form .btn{border:0;align-self:stretch;min-height:52px;font-size:14px;padding:10px 12px}
.err{margin:0;color:var(--rust);font-size:14px;font-weight:700}
.sent p{margin:0;font-size:15px;color:var(--wood)}
.sent .actions,.mail .actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.register.mail{background-image:none;gap:14px}
.mail .addr{font-size:18px}
.mail .actions{display:grid!important;grid-template-columns:1fr 1fr}
.mail .actions .btn,.mail .actions .ghost{width:100%}
.mail .msub{font-size:13px;color:var(--muted);margin-top:2px}
.mail .btn{min-height:46px;padding:10px 18px}
.mail .ghost{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:13px;letter-spacing:.04em;padding:10px 14px;background:transparent;color:var(--rust);border:2px solid var(--rust);min-height:46px}
.sent .ghost{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:13px;letter-spacing:.04em;padding:8px 14px;background:transparent;color:var(--rust);border:2px solid var(--rust)}
.draftmsg{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12px;background:var(--sleeve);padding:12px;color:var(--bark);max-height:220px;overflow:auto}

/* merch: gift-shop price tags */
.shopfront{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;background:var(--rust);color:var(--mustard);padding:12px;transition:transform .12s}
.shopfront:active{transform:scale(.98)}
.shopfront img{width:72px;height:72px;object-fit:cover;box-shadow:0 0 0 2px var(--mustard)}
.shopfront b{display:block;font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:20px;line-height:1}
.shopfront small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;margin-top:6px;opacity:.9}
.shopfront .go{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:13px;background:var(--bark);padding:9px 12px;white-space:nowrap}
.shelf{display:flex;flex-direction:column;gap:10px}
.shelf-h{display:flex;align-items:center;gap:10px}
.shelf-h::after{content:"";flex:1;height:1px;background:var(--line);order:1}
.shelf-h .count{order:2;font-family:var(--mono);font-size:11px;color:var(--muted)}
.tags{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 10px}
.tag{display:flex;flex-direction:column;gap:8px;background:var(--paper);border:1px solid var(--line);padding:8px 8px 12px;transition:transform .12s, border-color .2s;min-width:0}
.tag:active{transform:scale(.97)}
.tag:hover{border-color:var(--rust)}
.tag .ph{position:relative;display:block;aspect-ratio:1;max-width:100%;background:var(--sleeve) url("art/crest.jpg") center/38% no-repeat;overflow:hidden}
.tag .ph img{display:block;width:100%;height:100%;object-fit:cover;background:#fff}
.tag .ph.noimg img{display:none}
.tag .pr{position:absolute;left:6px;top:6px;font-family:var(--mono);font-size:12px;background:var(--rust);color:var(--mustard);padding:3px 7px;font-variant-numeric:tabular-nums}
.tag b{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:13px;line-height:1.15;color:var(--bark);padding:0 2px}

/* guestbook */
.register{background:var(--paper);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:10px;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--line) 31px 32px)}
.register .kicker{color:var(--wood)}
.register .addr{font-family:var(--mono);font-size:15px;word-break:break-all;user-select:all;color:var(--bark)}
.register button{align-self:flex-start;}
.register button:not(.ghost){font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:13px;letter-spacing:.04em;background:var(--rust);color:var(--mustard);padding:10px 14px}

.wall{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px;padding:6px 4px}
.pol{background:var(--paper);padding:7px 7px 26px;box-shadow:0 8px 18px -8px rgba(43,21,10,.45);position:relative}
.pol img{width:100%;aspect-ratio:1;object-fit:cover}
.pol:nth-child(4n+1){transform:rotate(-2.5deg)}
.pol:nth-child(4n+2){transform:rotate(2deg)}
.pol:nth-child(4n+3){transform:rotate(1.5deg)}
.pol:nth-child(4n){transform:rotate(-1.5deg)}
.pol::after{content:"";position:absolute;top:-9px;left:50%;width:46%;height:18px;margin-left:-23%;
  background:rgba(231,222,206,.85);transform:rotate(-3deg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pol figcaption{position:absolute;left:8px;right:8px;bottom:6px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right}

.label{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.label b{font-family:var(--display);font-weight:900;font-size:18px;letter-spacing:.02em;color:var(--mustard)}

/* tab bar */
.tabs{flex:none;position:relative;display:grid;grid-template-columns:repeat(6,1fr);background:var(--bark);user-select:none;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;color:#b79c86;min-width:0;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;transition:color .2s}
.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--mustard)}
.ind{position:absolute;top:0;left:0;height:3px;width:calc(100% / 6);background:var(--rust);will-change:transform;margin-left:env(safe-area-inset-left,0px)}

@media (prefers-reduced-motion:reduce){ .vacancy b,.hanger,.vinyl .disc{animation:none} }
</style>
</head>

/* build */
const pager = document.getElementById("pager"), tabs = document.getElementById("tabs"), ind = document.getElementById("ind");
PANES.forEach((p,i)=>{
  const sec = document.createElement("section");
  sec.className="pane"; sec.id="p-"+p.id; sec.setAttribute("role","tabpanel"); sec.setAttribute("aria-label",p.label);
  sec.innerHTML = `<div class="inner">${p.html()}</div>`;
  pager.appendChild(sec);
  const b = document.createElement("button");
  b.type="button"; b.setAttribute("role","tab"); b.setAttribute("aria-selected", i===0);
  b.innerHTML = svg(p.id)+`<span>${p.label}</span>`;
  b.addEventListener("click", ()=> go(i));
  tabs.appendChild(b);
});

/* fit the sleeve headline to the column width */
function fit(){
  const el=document.getElementById("fit"); if(!el) return;
  const w=el.parentElement.clientWidth; el.style.fontSize="100px";
  el.style.fontSize = Math.floor(100*w/el.offsetWidth*0.99)+"px";
}
fit(); document.fonts && document.fonts.ready.then(fit);

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let current = 0;
function go(i, instant){
  if(current===i) pager.children[i].scrollTo({top:0, behavior: reduce?"auto":"smooth"});
  pager.scrollTo({left: i*pager.clientWidth, behavior: instant||reduce ? "auto" : "smooth"});
}
pager.addEventListener("click", e=>{
  const a = e.target.closest("[data-go]"); if(!a) return;
  e.preventDefault(); go(+a.dataset.go);
});
function sync(){
  const w = pager.clientWidth || 1, x = pager.scrollLeft;
  ind.style.transform = `translateX(${(x/w)*100}%)`;
  const i = Math.round(x/w);
  [...tabs.querySelectorAll("button")].forEach((b,k)=>b.setAttribute("aria-selected", k===i));
  if(i!==current){
    current=i;
    try{ history.replaceState(null,"","#"+PANES[i].id); }catch(e){}
  }
}
pager.addEventListener("scroll", ()=>requestAnimationFrame(sync), {passive:true});
addEventListener("resize", ()=>{ fit(); go(current,true); });
addEventListener("keydown", e=>{
  if(e.key==="ArrowRight") go(Math.min(current+1,PANES.length-1));
  if(e.key==="ArrowLeft") go(Math.max(current-1,0));
});
const start = PANES.findIndex(p=>"#"+p.id===location.hash);
if(start>0) requestAnimationFrame(()=>{ go(start,true); sync(); });

/* Spotify player: real embed on the live site, a link card elsewhere */
(function(){
  const box=document.getElementById("spPlayer"); const h=location.hostname;
  if(!/elektricanimals\.com$|github\.io$|^localhost$|^$/.test(h)) return;
  const f=document.createElement("iframe");
  f.src=`https://open.spotify.com/embed/album/${box.dataset.album}?utm_source=generator`;
  f.title="B & B MOTEL on Spotify"; f.loading="lazy";
  f.allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture";
  box.replaceChildren(f);
})();

/* Front desk signup → Mailchimp (inline via JSONP, falls back to a normal submit) */
document.querySelectorAll("form.desk").forEach(form=>{
  form.addEventListener("submit", e=>{
    e.preventDefault();
    const input=form.querySelector("input[type=email]"), msg=form.querySelector(".desk-msg"), btn=form.querySelector("button");
    const email=input.value.trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ msg.textContent="That email looks incomplete. Check it and try again."; input.focus(); return; }
    btn.disabled=true; msg.textContent="Checking you in…";
    const cb="mc"+Date.now(); let done=false;
    const fallback=()=>{ if(done) return; done=true; btn.disabled=false; msg.textContent="Finishing sign-up in a new tab…"; HTMLFormElement.prototype.submit.call(form); };
    window[cb]=r=>{ done=true; delete window[cb]; btn.disabled=false;
      const t=String(r&&r.msg||"").replace(/<[^>]+>/g,"");
      if(r&&r.result==="success"){ form.classList.add("done"); msg.textContent=/confirm/i.test(t)?"Almost there. Check your inbox and tap the link to confirm.":"You're checked in. You'll hear about spring dates first."; }
      else if(/already subscribed/i.test(t)){ form.classList.add("done"); msg.textContent="You're already on the list. See you in spring."; }
      else { msg.textContent=t.replace(/^\d+\s*-\s*/,"")||"Something went wrong. Please try again."; }
    };
    const url=CONFIG.mailchimp.action.replace("/post?","/post-json?")+"&EMAIL="+encodeURIComponent(email)+"&"+CONFIG.mailchimp.honeypot+"=&c="+cb;
    const sc=document.createElement("script"); sc.src=url; sc.onerror=fallback; document.body.appendChild(sc);
    setTimeout(fallback, 8000);
  });
});

/* copy email */
document.querySelectorAll("button.copy").forEach(btn=>btn.addEventListener("click", ()=>{
  const i=btn.dataset.i, email=CONFIG.contacts[i].email;
  const done = t => { btn.textContent=t; setTimeout(()=>btn.textContent="Copy email",1600); };
  const sel = ()=>{ const r=document.createRange(); r.selectNodeContents(document.getElementById("addr"+i)); const s=getSelection(); s.removeAllRanges(); s.addRange(r); done("Selected, copy it"); };
  try{ navigator.clipboard.writeText(email).then(()=>done("Copied"), sel); }catch(err){ sel(); }
}));
</script>
